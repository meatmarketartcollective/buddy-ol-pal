# Pokemon species pack: 20 characters, art by Casey Benson.
# # Every species and every mood carries two art frames that cycle every
# tick; featureless designs get a gentle sway so nothing sits frozen.
# The engine's 7-state animation layer (blink, zzz drift, hearts,
# spinner, glitch) runs on top. Sleeping/resting/petted ride the idle
# frames. Sole exception: petrock, who is a rock and does not animate.
# That is the joke.
# Drop in ~/.config/hatch/packs/ (or $HATCH_HOME/packs).

