# Super Smash Bros species pack: 20 characters, art by Casey Benson.
# # Each mood carries two art frames that cycle every tick; the engine's
# 7-state animation layer (blink, zzz drift, hearts, spinner, glitch)
# runs on top. Sleeping/resting/petted ride the idle frames.
# Drop in ~/.config/hatch/packs/ (or $HATCH_HOME/packs).

