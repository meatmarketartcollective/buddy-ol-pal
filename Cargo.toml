[package]
name = "buddy-ol-pal"
version = "0.5.0"
edition = "2021"
description = "A terminal companion that lives in your terminal and reacts to real events"
license = "MIT"

[[bin]]
name = "buddy"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
petname = "2"
ureq = { version = "=2.9.7", default-features = false, features = ["tls"] }
rpassword = "7"

[dev-dependencies]
tempfile = "3"
